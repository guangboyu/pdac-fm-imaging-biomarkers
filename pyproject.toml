[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdacfm"
version = "1.0.0"
description = "Frozen foundation-model imaging biomarkers for pancreatic cancer in mouse MRI and human CT"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Guangbo Yu" }]
dependencies = [
    "numpy==2.4.4",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "optuna==4.8.0",
    "xgboost==3.2.0",
    "scikit-survival==0.27.0",
    "lifelines==0.30.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
imaging = [
    "torch>=2.6,<2.8",
    "timm==1.0.26",
    "SimpleITK==2.5.3",
    "nibabel==5.4.2",
]

[tool.setuptools.packages.find]
include = ["pdacfm*"]
